plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zehrakinik.game'
    compileSdk 34
    // CI: GitHub runner'daki en guncel NDK (ZK_NDK_VERSION); yerelde AGP varsayilani
    if (System.getenv('ZK_NDK_VERSION')) { ndkVersion System.getenv('ZK_NDK_VERSION') }

    defaultConfig {
        applicationId 'com.zehrakinik.game'
        minSdk 26            // AAudio
        targetSdk 34
        // Surum: CI calisma numarasi (her build bir oncekinin uzerine guncelleme olarak kurulur)
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ? 100 + System.getenv('GITHUB_RUN_NUMBER').toInteger() : 2)
        versionName (System.getenv('GITHUB_RUN_NUMBER') ? "0.${System.getenv('GITHUB_RUN_NUMBER')}" : '0.2-garaj')
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }
    // Iki surum: klasik oyun ve acik dunya (ayri paket: telefona yan yana kurulur)
    flavorDimensions 'edition'
    productFlavors {
        classic {
            dimension 'edition'
            resValue 'string', 'app_name', 'Zehra Kinik'
        }
        world {
            dimension 'edition'
            applicationIdSuffix '.world'
            resValue 'string', 'app_name', 'Zehra Kinik Acik Dunya'
            externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DZK_OPENWORLD=ON' } }
        }
    }
    // Sabit imza: CI'da ZK_KEYSTORE (dosya yolu) + ZK_KEYSTORE_PASS varsa her build ayni anahtarla imzalanir
    // (GitHub secret'lari; repo acik oldugu icin anahtar repoda tutulmaz). Yoksa varsayilan debug imzasi.
    signingConfigs {
        if (System.getenv('ZK_KEYSTORE')) {
            zk {
                storeFile file(System.getenv('ZK_KEYSTORE'))
                storePassword System.getenv('ZK_KEYSTORE_PASS')
                keyAlias 'zehrakinik'
                keyPassword System.getenv('ZK_KEYSTORE_PASS')
            }
        }
    }
    buildTypes {
        release { minifyEnabled false }
        debug { if (System.getenv('ZK_KEYSTORE')) signingConfig signingConfigs.zk }
    }
}
