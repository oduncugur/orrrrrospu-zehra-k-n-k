name: Derleme

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# Ayni dalda yeni push gelirse eski calisma iptal (latest-build surumu icin yaris durumu olmasin)
concurrency:
  group: derleme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Windows + Linux (grafik oyun + konsol araclari)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Araclar
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix zip \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libasound2-dev libpulse-dev libgl-dev libegl-dev
      - name: SDL3 (statik, Linux + Windows)
        run: |
          git clone -q --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL /tmp/SDL || \
            git clone -q --depth 1 https://github.com/libsdl-org/SDL /tmp/SDL
          cd /tmp/SDL
          COMMON="-DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF"
          cmake -B build-linux $COMMON -DSDL_WAYLAND=OFF -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-linux
          cmake --build build-linux -j4 && cmake --install build-linux
          cmake -B build-win $COMMON -DCMAKE_TOOLCHAIN_FILE=build-scripts/cmake-toolchain-mingw64-x86_64.cmake -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-win
          cmake --build build-win -j4 && cmake --install build-win
      - name: Derle
        run: |
          cmake -B build-linux -DCMAKE_PREFIX_PATH=/tmp/sdl3-linux
          cmake --build build-linux -j4
          cmake -B build-win -DCMAKE_TOOLCHAIN_FILE=/tmp/SDL/build-scripts/cmake-toolchain-mingw64-x86_64.cmake -DCMAKE_PREFIX_PATH=/tmp/sdl3-win
          cmake --build build-win -j4
          # Kalan testlerin KALDI satirlari acik "annotation" olarak yazilir (log indirmeden okunur)
          ctest --test-dir build-linux --output-on-failure > ctest.log 2>&1 || { grep -B3 -E "KALDI" ctest.log | head -30 | sed 's/^/::error::/'; exit 1; }
          mkdir -p out/linux out/win
          cp build-linux/zehra_game build-linux/zehra_sim build-linux/zehra_garage out/linux/
          cp build-win/zehra_game.exe build-win/zehra_sim.exe build-win/zehra_garage.exe out/win/
          cp README.md out/linux/ && cp README.md out/win/
          (cd out/win && zip -q ../ZehraKinik_Windows_x64.zip *)
          (cd out/linux && zip -q ../ZehraKinik_Linux_x64.zip *)
          cp build-win/zehra_game.exe out/ZehraKinik.exe
          cp build-win/zehra_world.exe out/ZehraKinikAcikDunya.exe
          cp build-linux/zehra_game out/ZehraKinik_Linux
      - uses: actions/upload-artifact@v4
        with:
          name: masaustu
          path: |
            out/*.zip
            out/ZehraKinik.exe
            out/ZehraKinikAcikDunya.exe
            out/ZehraKinik_Linux

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK derle
        env:
          ZK_KEYSTORE_B64: ${{ secrets.ZK_KEYSTORE_B64 }}
          ZK_KEYSTORE_PASS: ${{ secrets.ZK_KEYSTORE_PASS }}
        run: |
          if [ -n "$ZK_KEYSTORE_B64" ]; then echo "$ZK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zk.keystore"; export ZK_KEYSTORE="$RUNNER_TEMP/zk.keystore"; echo "Sabit imza"; else echo "UYARI: imza secret'i yok (debug imzasi)"; fi
          export ZK_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")
          echo "NDK: $ZK_NDK_VERSION"
          gradle -p android assembleDebug --no-daemon --stacktrace
          mkdir -p out && cp android/app/build/outputs/apk/classic/debug/app-classic-debug.apk out/ZehraKinik.apk
          cp android/app/build/outputs/apk/world/debug/app-world-debug.apk out/ZehraKinikAcikDunya.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            out/ZehraKinik.apk
            out/ZehraKinikAcikDunya.apk

  release:
    name: Indirme linki (latest-build)
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Surumu guncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release delete latest-build --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create latest-build dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Zehra Kinik - son derleme" \
            --notes "Otomatik derleme (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}). Android: ZehraKinik.apk (klasik) + ZehraKinikAcikDunya.apk (acik dunya) (bilinmeyen kaynaklara izin verin). Windows: ZehraKinik.exe (tek dosya, zip gerekmez; SmartScreen uyarisinda 'Yine de calistir'). Linux: ZehraKinik_Linux (chmod +x). Zip'lerde oyun + zehra_game, zehra_sim ve zehra_garage (konsol araclari)."
